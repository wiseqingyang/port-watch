name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must match the stable package.json version.');
          }
          JS
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11 --registry=https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Publish to npm with provenance
        run: npm publish --access public --provenance

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the published CLI
        run: |
          version=$(node -p "require('./package.json').version")
          cd "$RUNNER_TEMP"
          actual=$(npm exec --yes --registry=https://registry.npmjs.org --package="@wiseqingyang/port-watch@$version" -- port-watch --version)
          test "$actual" = "$version"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "PortWatch $GITHUB_REF_NAME"
